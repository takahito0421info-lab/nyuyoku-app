<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>介護チャット</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-bg: #1a3a5c;
      --sidebar-text: #b0bec5;
      --sidebar-hover: rgba(255,255,255,0.08);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --message-hover: #f9fafb;
      --input-bg: #f3f4f6;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background: #f0f2f5;
    }

    /* ── Loading ── */
    #loading {
      position: fixed; inset: 0;
      background: white;
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Setup Screen ── */
    #setup-screen {
      display: none;
      align-items: center; justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #1a3a5c 0%, #2563eb 100%);
    }
    .setup-card {
      background: white; border-radius: 14px;
      padding: 40px; width: 100%; max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .setup-card h2 { font-size: 20px; color: #1a3a5c; margin-bottom: 12px; }
    .setup-card p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
    .code-block {
      background: #f1f5f9; border-radius: 8px;
      padding: 16px; margin: 16px 0;
      font-family: 'Courier New', monospace; font-size: 13px;
      line-height: 2;
    }
    .code-block .key { color: #0369a1; }
    .code-block .val { color: #dc2626; }

    /* ── Auth Screen ── */
    #auth-screen {
      display: none;
      align-items: center; justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #1a3a5c 0%, #2563eb 100%);
    }
    .auth-card {
      background: white; border-radius: 14px;
      padding: 40px; width: 100%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo h1 { font-size: 24px; font-weight: 700; color: #1a3a5c; }
    .auth-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .auth-tabs {
      display: flex; border-bottom: 2px solid var(--border);
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1; padding: 10px; text-align: center;
      cursor: pointer; font-size: 14px; color: var(--text-muted);
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: color 0.2s;
    }
    .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

    .auth-form { display: flex; flex-direction: column; gap: 14px; }
    .auth-form.hidden { display: none; }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 13px; font-weight: 500; color: var(--text); }
    .form-group input {
      padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--primary); }

    .btn-primary {
      padding: 12px; background: var(--primary); color: white;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 500;
      font-family: inherit; cursor: pointer; margin-top: 4px;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-msg {
      font-size: 13px; padding: 10px 14px;
      border-radius: 6px; display: none;
    }
    .auth-msg.error { color: #dc2626; background: #fef2f2; }
    .auth-msg.success { color: #059669; background: #f0fdf4; }

    /* ── App Layout ── */
    #app-screen {
      display: none; height: 100vh; flex-direction: row;
    }
    #app-screen.visible { display: flex; }

    /* Sidebar */
    .sidebar {
      width: 260px; background: var(--sidebar-bg);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .workspace-name { font-size: 17px; font-weight: 700; color: white; }
    .workspace-sub {
      font-size: 12px; color: var(--sidebar-text); margin-top: 3px;
      display: flex; align-items: center; gap: 6px;
    }
    .dot-online {
      width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
    }
    .sidebar-section { padding: 16px 12px 4px; }
    .sidebar-section-title {
      font-size: 11px; font-weight: 600; color: var(--sidebar-text);
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 0 8px; margin-bottom: 4px;
    }
    .channel-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 6px; cursor: pointer;
      color: var(--sidebar-text); font-size: 14px;
      transition: background 0.15s, color 0.15s;
    }
    .channel-item:hover { background: var(--sidebar-hover); color: white; }
    .channel-item.active { background: rgba(255,255,255,0.18); color: white; font-weight: 500; }
    .ch-hash { font-size: 16px; opacity: 0.6; }
    .ch-unread {
      margin-left: auto;
      background: #ef4444; color: white;
      font-size: 11px; font-weight: 700;
      padding: 1px 6px; border-radius: 10px; min-width: 18px;
      text-align: center;
    }

    .sidebar-footer {
      margin-top: auto; padding: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .user-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px; border-radius: 6px; cursor: default;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: white; flex-shrink: 0;
    }
    .user-row-text { flex: 1; overflow: hidden; }
    .user-display-name {
      font-size: 14px; font-weight: 500; color: white;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-status-label { font-size: 12px; color: var(--sidebar-text); }
    .logout-btn {
      background: none; border: none; color: var(--sidebar-text);
      cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 16px;
      transition: color 0.15s, background 0.15s;
    }
    .logout-btn:hover { color: white; background: var(--sidebar-hover); }

    /* Main Chat */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: white; }

    .chat-header {
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .chat-header-hash { font-size: 20px; color: var(--text-muted); }
    .chat-header-name { font-size: 17px; font-weight: 700; }
    .chat-header-divider {
      width: 1px; height: 18px; background: var(--border); margin: 0 4px;
    }
    .chat-header-desc { font-size: 13px; color: var(--text-muted); }

    /* Messages */
    .messages-area {
      flex: 1; overflow-y: auto; padding: 16px 24px;
      display: flex; flex-direction: column; gap: 0;
    }
    .messages-area::-webkit-scrollbar { width: 5px; }
    .messages-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

    .day-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--text-muted); font-size: 12px; font-weight: 500;
    }
    .day-divider::before, .day-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .msg-group {
      display: flex; gap: 12px;
      padding: 4px 8px; border-radius: 8px;
      transition: background 0.1s;
    }
    .msg-group:hover { background: var(--message-hover); }
    .msg-group + .msg-group { margin-top: 2px; }
    .msg-avatar { flex-shrink: 0; margin-top: 2px; }
    .msg-body { flex: 1; min-width: 0; }
    .msg-header {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px;
    }
    .msg-author { font-size: 15px; font-weight: 600; }
    .msg-time { font-size: 12px; color: var(--text-muted); }
    .msg-content {
      font-size: 15px; line-height: 1.65;
      word-break: break-word; white-space: pre-wrap;
    }

    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--text-muted); gap: 8px; text-align: center;
    }
    .empty-icon { font-size: 52px; margin-bottom: 4px; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text); }
    .empty-desc { font-size: 14px; }

    /* Input */
    .input-area { padding: 10px 24px 20px; flex-shrink: 0; }
    .input-box {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--input-bg); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 10px 14px;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-box:focus-within { border-color: var(--primary); background: white; }
    .message-input {
      flex: 1; border: none; background: transparent;
      font-size: 15px; font-family: inherit; color: var(--text);
      resize: none; outline: none; max-height: 150px; min-height: 24px;
      line-height: 1.6;
    }
    .message-input::placeholder { color: #9ca3af; }
    .send-btn {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--primary); color: white; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s;
    }
    .send-btn:hover { background: var(--primary-hover); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 600px) {
      .sidebar { width: 200px; }
      .chat-header-desc, .chat-header-divider { display: none; }
      .chat-header, .messages-area, .input-area { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

<!-- ①　Loading -->
<div id="loading"><div class="spinner"></div></div>

<!-- ②　Setup (Supabase未設定時) -->
<div id="setup-screen">
  <div class="setup-card">
    <h2>⚙️ Supabase の設定が必要です</h2>
    <p>このファイルをテキストエディタで開き、先頭の設定欄に Supabase の情報を貼り付けてください。</p>
    <div class="code-block">
      <span class="key">SUPABASE_URL</span> = '<span class="val">ここにURLを貼る</span>'<br>
      <span class="key">SUPABASE_ANON_KEY</span> = '<span class="val">ここにAnon Keyを貼る</span>'
    </div>
    <p>Supabase ダッシュボード → <strong>Settings → API</strong> で確認できます。</p>
  </div>
</div>

<!-- ③　Auth (ログイン/登録) -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>🏥 介護チャット</h1>
      <p>職場の情報共有ツール</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">ログイン</div>
      <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">新規登録</div>
    </div>

    <!-- Login -->
    <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="login-email" placeholder="例: tanaka@kaigo.jp" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="login-password" placeholder="パスワード" required autocomplete="current-password">
      </div>
      <div class="auth-msg error" id="login-error"></div>
      <button type="submit" class="btn-primary" id="login-btn">ログイン</button>
    </form>

    <!-- Signup -->
    <form class="auth-form hidden" id="signup-form" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label>表示名（名前）</label>
        <input type="text" id="signup-name" placeholder="例: 田中 花子" required>
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="signup-email" placeholder="例: tanaka@kaigo.jp" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>パスワード（6文字以上）</label>
        <input type="password" id="signup-password" placeholder="パスワード" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-msg" id="signup-msg"></div>
      <button type="submit" class="btn-primary" id="signup-btn">アカウント作成</button>
    </form>
  </div>
</div>

<!-- ④　App (メイン画面) -->
<div id="app-screen">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="workspace-name">🏥 介護チャット</div>
      <div class="workspace-sub">
        <span class="dot-online"></span>
        <span>オンライン</span>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">チャンネル</div>
      <div id="channel-list"></div>
    </div>

    <div class="sidebar-footer">
      <div class="user-row">
        <div class="avatar" id="sidebar-avatar">?</div>
        <div class="user-row-text">
          <div class="user-display-name" id="sidebar-name">-</div>
          <div class="user-status-label">オンライン</div>
        </div>
        <button class="logout-btn" onclick="handleLogout()" title="ログアウト">⏻</button>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="chat-header">
      <span class="chat-header-hash">#</span>
      <span class="chat-header-name" id="channel-name">チャンネルを選択</span>
      <div class="chat-header-divider" id="header-divider" style="display:none"></div>
      <span class="chat-header-desc" id="channel-desc"></span>
    </div>

    <div class="messages-area" id="messages-area">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">💬</div>
        <div class="empty-title">チャンネルを選んでください</div>
        <div class="empty-desc">左のリストからチャンネルを選択しましょう</div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea
          class="message-input" id="message-input"
          placeholder="チャンネルを選択してください"
          rows="1" disabled
          onkeydown="handleKeyDown(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled title="送信 (Enter)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module">
// ============================================================
// ⚙️  設定 — Supabase ダッシュボード > Settings > API で確認
// ============================================================
const SUPABASE_URL     = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
// ============================================================

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ── 設定チェック ──
function hide(id) { document.getElementById(id).style.display = 'none'; }
function show(id, d='flex') { document.getElementById(id).style.display = d; }

if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
  hide('loading');
  show('setup-screen');
  throw new Error('Supabase not configured');
}

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── State ──
let me = null;         // auth user
let profile = null;    // profiles row
let channels = [];
let currentCh = null;  // selected channel
let realtimeCh = null; // supabase realtime channel

// ── Avatar colors ──
const COLORS = ['#2563eb','#7c3aed','#db2777','#dc2626','#d97706','#059669','#0891b2','#9333ea'];
function avatarColor(str) {
  let h = 0;
  for (const c of str) h = c.charCodeAt(0) + ((h << 5) - h);
  return COLORS[Math.abs(h) % COLORS.length];
}
function initials(name) { return (name || '?').charAt(0).toUpperCase(); }

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Screen helper ──
function showScreen(name) {
  hide('loading');
  document.getElementById('auth-screen').style.display  = name === 'auth' ? 'flex' : 'none';
  document.getElementById('app-screen').classList.toggle('visible', name === 'app');
}

// ── Auth tabs ──
window.switchTab = (tab) => {
  ['login','signup'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`${t}-form`).classList.toggle('hidden', t !== tab);
  });
};

function setMsg(id, text, type='error') {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `auth-msg ${type}`;
  el.style.display = text ? 'block' : 'none';
}

// ── Login ──
window.handleLogin = async (e) => {
  e.preventDefault();
  setMsg('login-error','');
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'ログイン中...';
  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('login-email').value,
    password: document.getElementById('login-password').value,
  });
  if (error) {
    setMsg('login-error','メールアドレスまたはパスワードが正しくありません');
    btn.disabled = false; btn.textContent = 'ログイン';
  }
};

// ── Signup ──
window.handleSignup = async (e) => {
  e.preventDefault();
  setMsg('signup-msg','');
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;
  const btn = document.getElementById('signup-btn');
  btn.disabled = true; btn.textContent = '作成中...';

  const { error } = await supabase.auth.signUp({
    email, password,
    options: { data: { display_name: name } },
  });
  if (error) {
    const msg = error.message === 'User already registered'
      ? 'このメールアドレスは既に登録されています'
      : error.message;
    setMsg('signup-msg', msg);
    btn.disabled = false; btn.textContent = 'アカウント作成';
  } else {
    setMsg('signup-msg','✓ アカウントを作成しました。ログインしてください。','success');
    setTimeout(() => {
      switchTab('login');
      document.getElementById('login-email').value = email;
      btn.disabled = false; btn.textContent = 'アカウント作成';
    }, 1800);
  }
};

// ── Logout ──
window.handleLogout = async () => {
  if (!confirm('ログアウトしますか？')) return;
  if (realtimeCh) { supabase.removeChannel(realtimeCh); realtimeCh = null; }
  await supabase.auth.signOut();
};

// ── Profile ──
async function fetchProfile(uid) {
  const { data } = await supabase.from('profiles').select('*').eq('id', uid).single();
  return data;
}

// ── Channels ──
async function loadChannels() {
  const { data } = await supabase.from('channels').select('*').order('sort_order', { ascending: true });
  channels = data || [];
  renderChannels();
}

function renderChannels() {
  document.getElementById('channel-list').innerHTML = channels.map(ch => `
    <div class="channel-item ${currentCh?.id === ch.id ? 'active' : ''}"
         onclick="selectChannel('${ch.id}')">
      <span class="ch-hash">#</span>
      <span>${esc(ch.name)}</span>
    </div>
  `).join('');
}

// ── Select Channel ──
window.selectChannel = async (chId) => {
  currentCh = channels.find(c => c.id === chId);
  if (!currentCh) return;

  document.getElementById('channel-name').textContent = currentCh.name;
  const desc = currentCh.description || '';
  document.getElementById('channel-desc').textContent = desc;
  document.getElementById('header-divider').style.display = desc ? 'block' : 'none';

  const input = document.getElementById('message-input');
  input.disabled = false;
  input.placeholder = `#${currentCh.name} へメッセージを送信（Enter で送信 / Shift+Enter で改行）`;
  document.getElementById('send-btn').disabled = false;

  renderChannels();

  // Unsubscribe old realtime
  if (realtimeCh) { supabase.removeChannel(realtimeCh); realtimeCh = null; }

  await loadMessages();
  subscribeMessages(chId);
};

// ── Load Messages ──
async function loadMessages() {
  const area = document.getElementById('messages-area');
  area.innerHTML = '<div style="text-align:center;padding:48px;color:#9ca3af;font-size:14px;">読み込み中...</div>';

  const { data } = await supabase
    .from('messages')
    .select('*, profiles(display_name)')
    .eq('channel_id', currentCh.id)
    .order('created_at', { ascending: true })
    .limit(200);

  area.innerHTML = '';

  if (!data || data.length === 0) {
    area.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👋</div>
        <div class="empty-title">#${esc(currentCh.name)} へようこそ</div>
        <div class="empty-desc">最初のメッセージを送ってみましょう</div>
      </div>`;
    return;
  }

  let lastDate = '';
  for (const msg of data) {
    const d = new Date(msg.created_at);
    const dateStr = d.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
    if (dateStr !== lastDate) {
      const div = document.createElement('div');
      div.className = 'day-divider';
      div.textContent = dateStr;
      area.appendChild(div);
      lastDate = dateStr;
    }
    area.appendChild(buildMsgEl(msg));
  }
  area.scrollTop = area.scrollHeight;
}

// ── Build message element ──
function buildMsgEl(msg) {
  const name = msg.profiles?.display_name || '不明';
  const color = avatarColor(name);
  const time = new Date(msg.created_at).toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });

  const div = document.createElement('div');
  div.className = 'msg-group';
  div.innerHTML = `
    <div class="msg-avatar">
      <div class="avatar" style="background:${color}">${esc(initials(name))}</div>
    </div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-author">${esc(name)}</span>
        <span class="msg-time">${time}</span>
      </div>
      <div class="msg-content">${esc(msg.content)}</div>
    </div>`;
  return div;
}

// ── Realtime subscription ──
function subscribeMessages(chId) {
  realtimeCh = supabase
    .channel(`room:${chId}`)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: `channel_id=eq.${chId}`,
    }, async (payload) => {
      // Fetch with profile join
      const { data } = await supabase
        .from('messages')
        .select('*, profiles(display_name)')
        .eq('id', payload.new.id)
        .single();
      if (!data) return;

      const area = document.getElementById('messages-area');
      const emptyState = area.querySelector('.empty-state');
      if (emptyState) emptyState.remove();

      // Day divider if needed
      const d = new Date(data.created_at);
      const dateStr = d.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
      const lastDivider = area.querySelector('.day-divider:last-of-type');
      if (!lastDivider || lastDivider.textContent !== dateStr) {
        const div = document.createElement('div');
        div.className = 'day-divider';
        div.textContent = dateStr;
        area.appendChild(div);
      }

      area.appendChild(buildMsgEl(data));
      // Auto-scroll if near bottom
      const atBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 120;
      if (atBottom) area.scrollTop = area.scrollHeight;
    })
    .subscribe();
}

// ── Send Message ──
window.sendMessage = async () => {
  const input = document.getElementById('message-input');
  const content = input.value.trim();
  if (!content || !currentCh || !me) return;

  input.value = '';
  input.style.height = 'auto';

  const { error } = await supabase.from('messages').insert({
    channel_id: currentCh.id,
    user_id: me.id,
    content,
  });
  if (error) {
    input.value = content;
    alert('送信に失敗しました: ' + error.message);
  }
};

window.handleKeyDown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
};

window.autoResize = (el) => {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
};

// ── Auth state ──
supabase.auth.onAuthStateChange(async (event, session) => {
  if (session?.user) {
    me = session.user;

    // プロフィール取得（トリガーの遅延対応で最大3回リトライ）
    for (let i = 0; i < 3; i++) {
      profile = await fetchProfile(me.id);
      if (profile) break;
      await new Promise(r => setTimeout(r, 800));
    }

    if (profile) {
      const color = avatarColor(profile.display_name);
      const av = document.getElementById('sidebar-avatar');
      av.textContent = initials(profile.display_name);
      av.style.background = color;
      document.getElementById('sidebar-name').textContent = profile.display_name;
    }

    await loadChannels();
    showScreen('app');

    // 最初のチャンネルを自動選択
    if (channels.length > 0 && !currentCh) {
      selectChannel(channels[0].id);
    }
  } else {
    me = null; profile = null; currentCh = null;
    if (realtimeCh) { supabase.removeChannel(realtimeCh); realtimeCh = null; }
    showScreen('auth');
  }
});
</script>
